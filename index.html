<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omniscient Gold Tracker</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 320px;
            border: 1px solid #334155;
        }
        h1 {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .price {
            font-size: 2.5rem;
            font-weight: bold;
            color: #facc15;
            margin-bottom: 15px;
        }
        .status-container {
            font-size: 1rem;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
            width: 80%;
        }
        #market-status {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Omniscient Gold Tracker</h1>
        <div class="price" id="gold-price">Loading...</div>
        <div class="status-container">
            Status: <span id="market-status">Memeriksa...</span>
        </div>
    </div>
    
    <script src="/static/script.js"></script>
</body>
</html>
